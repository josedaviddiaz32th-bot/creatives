# Creative pipeline configuration. Every agent reads this file first.
# Edit values here, not in the agent files.

brand:
  name: "The Daily Glow Co."
  hero_product: "The Wrinkle Smooth Face Set (5 Pieces)"
  offer: "2 Sets for $60"        # re-check live price on Shopify before using
  # What we may claim comes ONLY from docs/lessons-learned.md sections 1-2.

source:
  # "Avatars" Google Doc: persona angles, Reddit personas, objections.
  persona_doc: "1ySwoyCBQVAL59c04-La1qvvPs1qI766vbqMqYzMZJ0w"
  lessons: "docs/lessons-learned.md"   # owner's handoff; overrides defaults

video:
  # Length depends on the funnel stage of the slot (docs/creative-strategy.md).
  seconds_by_stage:
    tof: { min: 30, max: 50 }
    mof: { min: 25, max: 45 }
    bof: { min: 15, max: 25 }
  aspect_ratio: "9:16"
  language: "en"
  words_per_second: 3.0         # fast UGC delivery after pause trimming (research Nov 7, 2026); 30s ≈ 90 words
  # Talking clips (lip-sync research): one sentence per clip, <= 15 words, 4-6 s.
  talking_clip: { max_words: 15, min_seconds: 4, max_seconds: 6 }
  structure:
    hook: { seconds: 5, must_be_question: true }
    body: { note: "dig into the problem, then turn smoothly to the patches; open loops over ~25s" }
    cta: { seconds: 5, style: subtle }
  strategy: "docs/creative-strategy.md"   # every run fills one slot from it
editing:
  # Fast-paced spec (docs/research/production-fixes-research.md). Assembly and video review enforce it.
  max_shot_seconds: 2.5
  first_3s_change_every_seconds: 1.5
  max_word_gap_seconds: 0.3      # trim pauses > 0.15 s to 0.06-0.10 s
  punch_in_pct: [112, 118]       # alternate at every jump cut; 125-130 on emphasis words
  still_push_pct: [6, 10]
  broll_every_seconds: [5, 6]    # also cover any word with weak lip sync
  popup_every_seconds: [3, 5]
  captions: word_by_word         # 64-80 px bold white, black stroke, current word highlighted; PNG overlays
  sfx_lufs: [-22, -18]           # about one SFX per visual event
  max_speedup: 1.08              # whole clip, video and audio together, pitch preserved

generation:
  provider: higgsfield
  # Kling 3.0 Pro with native sound ≈ 2.5 credits/s, so 30s ≈ 75 credits.
  # Seedance 2.5 720p ≈ 7 credits/s (≈224) does not fit the cap.
  video_model: kling3_0
  video_mode: pro                # std ≈ 2 credits/s if budget is tight
  image_model: nano_banana_2     # multi-reference person + product edits
  cheap_image_model: gpt_image_2_6
  # Audio: if someone talks on camera, the voice is generated by the video
  # model in the same clip (lip sync). ElevenLabs only for voiceover-only videos.
  audio_talking_head: native
  audio_voiceover_only: elevenlabs
  elevenlabs_narrator: "Lara"    # stability 0.45, style 0.5, similarity 0.75

budget:
  # Hard cap per video, by the slot's funnel stage: stop before any job that would exceed it.
  max_credits_by_stage: { tof: 135, mof: 120, bof: 70 }
  max_credits_per_video: 135    # absolute ceiling for any video
  max_retries_per_clip: 0       # owner: one generation per shot; any redo needs the owner's OK
  outputs_per_job: 1            # owner: never generate variations (num_images / batch = 1)
  still_fix_credits_auto: 3     # owner: still fixes may run without asking while this run's still-fix spend stays <= 3 credits (one edit per failed still); beyond that, or any clip redo, ask
  reserve_for_retries: 15       # credits held back from the first pass for fixes
  stop_if_balance_below: 100    # don't start a run that can't finish
  always_preflight: true        # get_cost: true before every paid job

schedule:
  active: false                 # trial mode (Nov 8, 2026): owner picks each video; no scheduled runs
  runs_per_day: 3
  timezone: "America/New_York"
  times: ["10:17", "15:17", "20:17"]

publishing:
  auto_publish: false           # owner approves the first rounds
  platforms:
    tiktok: { enabled: true, via: higgsfield }        # connected and active
    instagram: { enabled: false, via: meta_graph_api } # needs Meta app + token
    facebook: { enabled: false, via: meta_graph_api }  # needs Meta app + token

learning:
  # results-analyst (stage 0, once a day before the first run)
  read_metrics_after_hours: 48
  min_views_to_judge: 300       # below this a post is TOO_EARLY
  win_vs_stage_median: 1.5      # WIN at >= 1.5x its funnel stage's median
  loss_vs_stage_median: 0.67    # LOSS at <= 0.67x
  retire_after_losses: 2        # with no wins -> RETIRED, not used again
  explore_share: 0.3            # after the test week, ~30% of slots explore
  new_swipe_every_runs: 3       # creative-scout adds a library breakdown at least this often

review:
  min_story_score: 8            # story-reviewer, before any credits are spent
  min_hook_score_tof: 9         # TOF hooks and shareability must reach this
  max_story_revisions: 2        # then stop and flag for the owner
  max_prompt_revisions: 2       # prompt-reviewer loops, then flag the owner
  min_score_to_publish: 8       # video-reviewer scores 1-10
